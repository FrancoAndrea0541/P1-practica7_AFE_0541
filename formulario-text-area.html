<!--Formulario con area de texto: <textarea> permite el ingreso de texto multi linea y de mayor longitud. type="email" valida la estructura de un correo -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Ingresa tu correo:
<input type="email" name="correo">
<br>
Ingresa tus comentarios:
<textarea name="comentarios" rows="1" cols="10"></textarea>
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>
