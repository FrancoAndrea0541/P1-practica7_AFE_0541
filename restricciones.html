<!-- Formulario con restricciones:
     - 'disabled': deshabilita el campo.
     - 'maxlength': define el máximo de caracteres permitidos.
     - 'readonly': habilita el contenido solo para lectura, impidiendo modificaciones. -->
<form action="" method="post">
    Ingresa tu nombre:
    <!-- Deshabilitación de campo -->
    <input type="text" name="nombre" disabled><br>
   
    <!-- Limitación de caracteres -->
    Contraseña:
    <input type="password" name="pass" maxlength="5"><br>
   
    <!-- Solo lectura -->
    Comentarios:
    <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
</form>
